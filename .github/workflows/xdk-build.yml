name: XDK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build-xex:
    runs-on:
      - self-hosted
      - Windows
      - X64
      - xdk

    steps:
      - uses: actions/checkout@v4

      - name: Build XEX
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\xdk\build-port.ps1 `
            -Configuration Release `
            -XdkRoot "C:\Program Files (x86)\Microsoft Xbox 360 SDK" `
            *>&1 | Tee-Object -FilePath xdk-build.log

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xdk-build-log
          path: xdk-build.log

      - name: Upload XEX
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: opennow-xex
          path: |
            xdk/bin/Release/default.xex
            xdk/bin/Release/cacert.pem

      - name: Publish build status
        if: always()
        continue-on-error: true
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runId = "${{ github.run_id }}"
          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/$runId"
          $status = "${{ job.status }}"
          if (Test-Path .\xdk-build.log) {
            $log = (Get-Content .\xdk-build.log -Tail 160) -join "`n"
          } else {
            $log = "xdk-build.log was not created."
          }

          $body = @"
          Latest XDK build status: **$status**

          Run ID: `$runId`
          Commit: `${{ github.sha }}`
          Run: $runUrl

          Last 160 lines of the build log:

          ```text
          $log
          ```
          "@

          $bodyPath = Join-Path $env:RUNNER_TEMP 'xdk-build-status.md'
          Set-Content -Path $bodyPath -Value $body -Encoding UTF8

          $issue = gh issue list `
            --repo "${{ github.repository }}" `
            --state open `
            --search 'XDK Build Status in:title' `
            --json number `
            --limit 1 `
            --jq '.[0].number'

          if ($issue) {
            gh issue edit $issue `
              --repo "${{ github.repository }}" `
              --title 'XDK Build Status' `
              --body-file $bodyPath
          } else {
            gh issue create `
              --repo "${{ github.repository }}" `
              --title 'XDK Build Status' `
              --body-file $bodyPath
          }
