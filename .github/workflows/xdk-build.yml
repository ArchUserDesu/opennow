name: XDK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build-xex:
    runs-on:
      - self-hosted
      - Windows
      - X64
      - xdk

    steps:
      - uses: actions/checkout@v4

      - name: Build XEX
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\xdk\build-port.ps1 `
            -Configuration Release `
            -XdkRoot "C:\Program Files (x86)\Microsoft Xbox 360 SDK" `
            *>&1 | Tee-Object -FilePath xdk-build.log

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xdk-build-log
          path: xdk-build.log

      - name: Upload XEX
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: opennow-xex
          path: |
            xdk/bin/Release/default.xex
            xdk/bin/Release/cacert.pem

      - name: Deploy XEX to Xbox and verify SHA-256
        if: success()
        shell: powershell
        env:
          XBOX_FTP_PASSWORD_SECRET: ${{ secrets.XBOX_FTP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $password = $env:XBOX_FTP_PASSWORD_SECRET
          if (-not $password) { $password = $env:XBOX_FTP_PASSWORD }
          if (-not $password) {
            Write-Warning 'Automatic Xbox deployment skipped: set GitHub Actions secret XBOX_FTP_PASSWORD or XBOX_FTP_PASSWORD on the self-hosted runner.'
            exit 0
          }

          $local = (Resolve-Path '.\xdk\bin\Release\default.xex').Path
          $uri = 'ftp://192.168.2.204/Hdd1/Homebrew/default.xex'
          $credential = New-Object System.Net.NetworkCredential('xbox', $password)

          $bytes = [System.IO.File]::ReadAllBytes($local)
          $request = [System.Net.FtpWebRequest]::Create($uri)
          $request.Method = [System.Net.WebRequestMethods+Ftp]::UploadFile
          $request.Credentials = $credential
          $request.UseBinary = $true
          $request.UsePassive = $true
          $request.KeepAlive = $false
          $request.ContentLength = $bytes.Length
          $stream = $request.GetRequestStream()
          try { $stream.Write($bytes, 0, $bytes.Length) } finally { $stream.Dispose() }
          $response = $request.GetResponse()
          try { Write-Host ('FTP upload: ' + $response.StatusDescription.Trim()) } finally { $response.Dispose() }

          $verifyPath = Join-Path $env:RUNNER_TEMP 'default.xex.remote'
          $download = [System.Net.FtpWebRequest]::Create($uri)
          $download.Method = [System.Net.WebRequestMethods+Ftp]::DownloadFile
          $download.Credentials = $credential
          $download.UseBinary = $true
          $download.UsePassive = $true
          $download.KeepAlive = $false
          $downloadResponse = $download.GetResponse()
          try {
            $input = $downloadResponse.GetResponseStream()
            try {
              $output = [System.IO.File]::Create($verifyPath)
              try { $input.CopyTo($output) } finally { $output.Dispose() }
            } finally { $input.Dispose() }
          } finally { $downloadResponse.Dispose() }

          $localHash = (Get-FileHash -Algorithm SHA256 $local).Hash
          $remoteHash = (Get-FileHash -Algorithm SHA256 $verifyPath).Hash
          Write-Host "Local SHA-256 : $localHash"
          Write-Host "Remote SHA-256: $remoteHash"
          if ($localHash -ne $remoteHash) {
            throw 'Xbox deployment hash mismatch.'
          }
          Write-Host 'Xbox deployment verified successfully.'

      - name: Publish build status
        if: always()
        continue-on-error: true
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runId = "${{ github.run_id }}"
          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/$runId"
          $status = "${{ job.status }}"
          if (Test-Path .\xdk-build.log) {
            $log = (Get-Content .\xdk-build.log -Tail 160) -join "`n"
          } else {
            $log = "xdk-build.log was not created."
          }

          $body = @"
          Latest XDK build status: **$status**

          Run ID: $runId
          Commit: ${{ github.sha }}
          Run: $runUrl

          Last 160 lines of the build log:

          ```text
          $log
          ```
          "@

          $bodyPath = Join-Path $env:RUNNER_TEMP 'xdk-build-status.md'
          Set-Content -Path $bodyPath -Value $body -Encoding UTF8

          $issue = gh issue list `
            --repo "${{ github.repository }}" `
            --state open `
            --search 'XDK Build Status in:title' `
            --json number `
            --limit 1 `
            --jq '.[0].number'

          if ($issue) {
            gh issue edit $issue `
              --repo "${{ github.repository }}" `
              --title 'XDK Build Status' `
              --body-file $bodyPath
          } else {
            gh issue create `
              --repo "${{ github.repository }}" `
              --title 'XDK Build Status' `
              --body-file $bodyPath
          }
