name: XDK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build-xex:
    runs-on:
      - self-hosted
      - Windows
      - X64
      - xdk

    steps:
      - uses: actions/checkout@v4

      - name: Build XEX
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\xdk\build-port.ps1 `
            -Configuration Release `
            -XdkRoot "C:\Program Files (x86)\Microsoft Xbox 360 SDK" `
            *>&1 | Tee-Object -FilePath xdk-build.log

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xdk-build-log
          path: xdk-build.log

      - name: Upload XEX
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: opennow-xex
          path: |
            xdk/bin/Release/default.xex
            xdk/bin/Release/cacert.pem

      - name: Deploy XEX to Xbox and verify SHA-256
        if: success()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $baseUri = 'ftp://192.168.2.204/Hdd1/Homebrew/'
          $targetName = 'default.xex'
          $tempName = 'default.xex.__uploading'
          $targetUri = $baseUri + $targetName
          $tempUri = $baseUri + $tempName
          $credential = New-Object System.Net.NetworkCredential('xbox', '1234')
          $local = (Resolve-Path '.\xdk\bin\Release\default.xex').Path
          $localHash = (Get-FileHash -Algorithm SHA256 $local).Hash
          $localSize = (Get-Item $local).Length

          function New-FtpRequest([string]$Uri, [string]$Method) {
            $r = [System.Net.FtpWebRequest]::Create($Uri)
            $r.Method = $Method
            $r.Credentials = $credential
            $r.UseBinary = $true
            $r.UsePassive = $true
            $r.KeepAlive = $false
            $r.Timeout = 15000
            $r.ReadWriteTimeout = 15000
            return $r
          }

          function Invoke-FtpDeleteIfExists([string]$Uri) {
            try {
              $r = New-FtpRequest $Uri ([System.Net.WebRequestMethods+Ftp]::DeleteFile)
              $resp = $r.GetResponse()
              try { Write-Host ('FTP delete: ' + $resp.StatusDescription.Trim()) } finally { $resp.Dispose() }
              return $true
            } catch [System.Net.WebException] {
              $resp = $_.Exception.Response
              if ($resp -and [int]$resp.StatusCode -eq 550) {
                Write-Host "FTP delete skipped (missing or unavailable): $Uri"
                if ($resp) { $resp.Dispose() }
                return $false
              }
              if ($resp) { $resp.Dispose() }
              throw
            }
          }

          function Invoke-FtpUpload([string]$Uri, [string]$Path) {
            $bytes = [System.IO.File]::ReadAllBytes($Path)
            $r = New-FtpRequest $Uri ([System.Net.WebRequestMethods+Ftp]::UploadFile)
            $r.ContentLength = $bytes.Length
            $stream = $r.GetRequestStream()
            try { $stream.Write($bytes, 0, $bytes.Length) } finally { $stream.Dispose() }
            $resp = $r.GetResponse()
            try { Write-Host ('FTP upload: ' + $resp.StatusDescription.Trim()) } finally { $resp.Dispose() }
          }

          function Invoke-FtpDownload([string]$Uri, [string]$Path) {
            if (Test-Path $Path) { Remove-Item -Force $Path }
            $r = New-FtpRequest $Uri ([System.Net.WebRequestMethods+Ftp]::DownloadFile)
            $resp = $r.GetResponse()
            try {
              $input = $resp.GetResponseStream()
              try {
                $output = [System.IO.File]::Create($Path)
                try { $input.CopyTo($output) } finally { $output.Dispose() }
              } finally { $input.Dispose() }
            } finally { $resp.Dispose() }
          }

          function Assert-FtpHash([string]$Uri, [string]$ExpectedHash, [string]$Label) {
            $verifyPath = Join-Path $env:RUNNER_TEMP ($Label + '.verify')
            Invoke-FtpDownload $Uri $verifyPath
            $remoteHash = (Get-FileHash -Algorithm SHA256 $verifyPath).Hash
            $remoteSize = (Get-Item $verifyPath).Length
            Write-Host "$Label size: $remoteSize bytes"
            Write-Host "$Label SHA-256: $remoteHash"
            if ($remoteHash -ne $ExpectedHash) {
              throw "$Label SHA-256 mismatch."
            }
          }

          # Prove that login/path/passive data transfer work before modifying anything.
          $list = New-FtpRequest $baseUri ([System.Net.WebRequestMethods+Ftp]::ListDirectory)
          $listResp = $list.GetResponse()
          try {
            $reader = New-Object System.IO.StreamReader($listResp.GetResponseStream())
            try {
              $entries = $reader.ReadToEnd()
              Write-Host "FTP directory listing for Hdd1/Homebrew:"
              Write-Host $entries
            } finally { $reader.Dispose() }
          } finally { $listResp.Dispose() }

          Write-Host "Local XEX: $localSize bytes"
          Write-Host "Local SHA-256: $localHash"

          # Never stream directly over the live target. Upload and verify a sidecar first.
          Invoke-FtpDeleteIfExists $tempUri | Out-Null
          Invoke-FtpUpload $tempUri $local
          Assert-FtpHash $tempUri $localHash 'staged-XEX'

          $promoted = $false
          try {
            # Preferred path: remove old target and atomically rename the verified sidecar.
            Invoke-FtpDeleteIfExists $targetUri | Out-Null
            $rename = New-FtpRequest $tempUri ([System.Net.WebRequestMethods+Ftp]::Rename)
            $rename.RenameTo = $targetName
            $renameResp = $rename.GetResponse()
            try { Write-Host ('FTP rename: ' + $renameResp.StatusDescription.Trim()) } finally { $renameResp.Dispose() }
            $promoted = $true
          } catch {
            Write-Warning ('FTP rename promotion failed; trying direct replacement fallback. ' + $_.Exception.Message)
          }

          if (-not $promoted) {
            # Some Xbox FTP servers do not implement RNFR/RNTO correctly. Since the staged
            # file is already hash-verified, fall back to delete + fresh STOR of the target.
            Invoke-FtpDeleteIfExists $targetUri | Out-Null
            Invoke-FtpUpload $targetUri $local
            Invoke-FtpDeleteIfExists $tempUri | Out-Null
          }

          Assert-FtpHash $targetUri $localHash 'deployed-XEX'
          Write-Host 'Xbox deployment verified successfully.'

      - name: Publish build status
        if: always()
        continue-on-error: true
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runId = "${{ github.run_id }}"
          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/$runId"
          $status = "${{ job.status }}"
          if (Test-Path .\xdk-build.log) {
            $log = (Get-Content .\xdk-build.log -Tail 160) -join "`n"
          } else {
            $log = "xdk-build.log was not created."
          }

          $body = @"
          Latest XDK build/deploy status: **$status**

          Run ID: $runId
          Commit: ${{ github.sha }}
          Run: $runUrl

          Last 160 lines of the build log:

          ```text
          $log
          ```
          "@

          $bodyPath = Join-Path $env:RUNNER_TEMP 'xdk-build-status.md'
          Set-Content -Path $bodyPath -Value $body -Encoding UTF8

          $issue = gh issue list `
            --repo "${{ github.repository }}" `
            --state open `
            --search 'XDK Build Status in:title' `
            --json number `
            --limit 1 `
            --jq '.[0].number'

          if ($issue) {
            gh issue edit $issue `
              --repo "${{ github.repository }}" `
              --title 'XDK Build Status' `
              --body-file $bodyPath
          } else {
            gh issue create `
              --repo "${{ github.repository }}" `
              --title 'XDK Build Status' `
              --body-file $bodyPath
          }
