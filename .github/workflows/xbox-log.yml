name: Xbox Log Fetch

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  fetch-log:
    runs-on:
      - self-hosted
      - Windows
      - X64
      - xdk

    steps:
      - name: Fetch latest OpenNOW log from Xbox
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = 'ftp://192.168.2.204/Hdd1/Homebrew/opennow.log'
          $credential = New-Object System.Net.NetworkCredential('xbox', '1234')
          $dest = Join-Path $env:GITHUB_WORKSPACE 'opennow.log'

          $request = [System.Net.FtpWebRequest]::Create($uri)
          $request.Method = [System.Net.WebRequestMethods+Ftp]::DownloadFile
          $request.Credentials = $credential
          $request.UseBinary = $true
          $request.UsePassive = $true
          $request.KeepAlive = $false
          $response = $request.GetResponse()
          try {
            $input = $response.GetResponseStream()
            try {
              $output = [System.IO.File]::Create($dest)
              try { $input.CopyTo($output) } finally { $output.Dispose() }
            } finally { $input.Dispose() }
          } finally { $response.Dispose() }

          $hash = (Get-FileHash -Algorithm SHA256 $dest).Hash
          $size = (Get-Item $dest).Length
          Write-Host "Fetched opennow.log ($size bytes, SHA-256 $hash)"

      - name: Upload Xbox log artifact
        uses: actions/upload-artifact@v4
        with:
          name: opennow-log
          path: opennow.log

      - name: Publish latest log tail for inspection
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tail = (Get-Content '.\opennow.log' -Tail 300) -join "`n"
          $hash = (Get-FileHash -Algorithm SHA256 '.\opennow.log').Hash
          $body = @"
          Latest Xbox OpenNOW log fetched by workflow run ${{ github.run_id }}.

          SHA-256: `$hash`

          Last 300 lines:

          ```text
          $tail
          ```
          "@
          $bodyPath = Join-Path $env:RUNNER_TEMP 'xbox-log-status.md'
          Set-Content -Path $bodyPath -Value $body -Encoding UTF8

          $issue = gh issue list `
            --repo "${{ github.repository }}" `
            --state open `
            --search 'Xbox OpenNOW Log in:title' `
            --json number `
            --limit 1 `
            --jq '.[0].number'

          if ($issue) {
            gh issue edit $issue --repo "${{ github.repository }}" --title 'Xbox OpenNOW Log' --body-file $bodyPath
          } else {
            gh issue create --repo "${{ github.repository }}" --title 'Xbox OpenNOW Log' --body-file $bodyPath
          }
